<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Notesgen Play Library</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="theme-color" content="#0d1017" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hub-header">
        <div>
          <p class="eyebrow">Interactive library</p>
          <h1>Notesgen Play Library</h1>
        </div>

        <div class="header-actions">
          <button class="control-button mute-button" type="button" data-mute-toggle aria-pressed="false">
            Mute
          </button>

          <label class="search-wrap" for="searchInput">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="searchInput"
              type="search"
              autocomplete="off"
              placeholder="Search games"
            />
          </label>
        </div>
      </header>

      <section class="toolbar" aria-live="polite">
        <p id="gameCount">0 games</p>
      </section>

      <section id="gameGrid" class="game-grid" aria-label="Games"></section>

      <p id="emptyState" class="empty-state" hidden>No games found.</p>

      <footer class="site-credit">Made by the big D -PNINS</footer>
    </main>

    <div id="gameModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>

      <section
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <header class="modal-header">
          <h2 id="modalTitle">Game</h2>
          <div class="modal-actions">
            <button class="control-button mute-button" type="button" data-mute-toggle aria-pressed="false">
              Mute
            </button>
            <button id="fullscreenButton" class="control-button" type="button">
              Fullscreen
            </button>
            <button id="closeButton" class="control-button close-button" type="button">
              Close
            </button>
          </div>
        </header>

        <div id="iframeWrap" class="iframe-wrap">
          <iframe
            id="gameFrame"
            title="Selected game"
            allow="fullscreen; gamepad; autoplay"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"
            referrerpolicy="no-referrer"
            loading="lazy"
          ></iframe>
        </div>
      </section>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
